<style>
:root{--blue:#58b8ff;--violet:#a269ff;--gold:#efc775;--ember:#ff713f;--shot-time:8s}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#020307;color:#fff}body{font-family:Cinzel,serif}.opening{position:relative;width:100%;height:100svh;overflow:hidden;isolation:isolate;background:#020307}.opening::after{content:"";position:absolute;inset:0;z-index:50;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.34) 72%,rgba(0,0,0,.85) 100%)}
.gate{position:absolute;inset:0;z-index:200;display:grid;place-items:center;padding:1.5rem;background:#020307;transition:opacity 1s ease,visibility 1s}.gate::before{content:"";position:absolute;inset:-12%;background:radial-gradient(circle at 50% 45%,rgba(80,126,203,.22),transparent 30%),conic-gradient(from 0deg at 50% 50%,transparent,rgba(147,93,255,.11),transparent 27%,rgba(71,171,255,.13),transparent 55%);animation:turn 22s linear infinite}.gate::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.85%,rgba(111,187,255,.36) 50%,transparent 50.15%);transform:scaleY(0);animation:rift 3s ease-in-out infinite}.gate.hidden{opacity:0;visibility:hidden;pointer-events:none}.gate-content{position:relative;z-index:2;text-align:center;max-width:760px}.sigil{position:relative;width:clamp(110px,17vw,190px);aspect-ratio:1;margin:0 auto 1.6rem;border:1px solid rgba(145,194,255,.42);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 65px rgba(73,168,255,.18),inset 0 0 34px rgba(154,85,255,.17);animation:breathe 3s ease-in-out infinite}.sigil::before,.sigil::after{content:"";position:absolute;width:inherit;aspect-ratio:1;border:1px solid rgba(239,199,117,.3);transform:rotate(45deg) scale(.72)}.sigil::after{transform:rotate(-45deg) scale(.52)}.sigil span{font-size:clamp(2rem,5vw,4.6rem);color:var(--gold);text-shadow:0 0 22px rgba(239,199,117,.55)}.gate .overline{font:500 clamp(.55rem,1.4vw,.75rem) 'JetBrains Mono',monospace;letter-spacing:.44em;text-transform:uppercase;color:#91c9f7}.gate h1{margin:.7rem 0;font-size:clamp(2rem,7vw,5.6rem);line-height:.95;letter-spacing:.08em}.gate p{margin:0 auto 1.7rem;max-width:48ch;color:#acb6c4;font-size:clamp(.78rem,1.6vw,1rem);line-height:1.65}.begin{padding:1rem 1.5rem;border:1px solid rgba(110,186,255,.72);background:rgba(4,10,21,.72);color:#fff;font:500 clamp(.58rem,1.3vw,.72rem) 'JetBrains Mono',monospace;letter-spacing:.19em;text-transform:uppercase;cursor:pointer;transition:.3s}.begin:hover,.begin:focus-visible{transform:translateY(-3px);border-color:#fff;box-shadow:0 0 38px rgba(73,168,255,.28);outline:none}.begin::after{content:" →";color:var(--gold)}
.topbar{position:absolute;z-index:100;top:max(1rem,env(safe-area-inset-top));left:max(1rem,env(safe-area-inset-left));right:max(1rem,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none}.sound,.skip{pointer-events:auto;padding:.68rem .95rem;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.56);color:#fff;font:500 .56rem 'JetBrains Mono',monospace;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;backdrop-filter:blur(8px)}.sound{cursor:pointer}.sound i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.55rem;background:#777}.sound.on i{background:var(--blue);box-shadow:0 0 12px var(--blue)}
.stage{position:absolute;inset:0;opacity:0;transition:opacity .65s ease;background:#020307}.opening.started .stage{opacity:1}.shots{position:absolute;inset:0}.shot{position:absolute;inset:0;opacity:0;visibility:hidden;overflow:hidden}.shot.active{opacity:1;visibility:visible;z-index:2}.shot.leaving{opacity:0;visibility:visible;z-index:3;transition:opacity .75s ease}.shot img{position:absolute}.shot .backdrop{inset:-8%;width:116%;height:116%;object-fit:cover;object-position:var(--position,center);filter:blur(24px) brightness(.34) saturate(.72);transform:scale(1.04);transition:transform var(--shot-time) linear}.shot.active .backdrop{transform:scale(1.1)}.shot .portrait{z-index:1;inset:clamp(3.8rem,7vh,6rem) clamp(1rem,5vw,5rem);width:calc(100% - clamp(2rem,10vw,10rem));height:calc(100% - clamp(7.6rem,14vh,12rem));object-fit:contain;object-position:var(--position,center);filter:brightness(.82) saturate(.92) contrast(1.06);transform:scale(.96);transition:transform var(--shot-time) ease-out,filter 1.2s ease;filter:drop-shadow(0 12px 38px rgba(0,0,0,.72)) brightness(.82) saturate(.92)}.shot.active .portrait{transform:scale(1);filter:drop-shadow(0 12px 38px rgba(0,0,0,.72)) brightness(.96) saturate(1)}.shot::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(1,2,7,.82),transparent 50%),linear-gradient(0deg,rgba(1,2,7,.73),transparent 42%)}.shot.right::before{background:linear-gradient(-90deg,rgba(1,2,7,.82),transparent 50%),linear-gradient(0deg,rgba(1,2,7,.73),transparent 42%)}.shot-center{position:absolute;z-index:4;left:clamp(1rem,7vw,8rem);bottom:clamp(5rem,13vh,9rem);max-width:min(560px,82vw);animation:captionIn .8s both}.right .shot-center{left:auto;right:clamp(1rem,7vw,8rem);text-align:right}.chapter{font:500 clamp(.5rem,1.2vw,.7rem) 'JetBrains Mono',monospace;letter-spacing:.38em;text-transform:uppercase;color:var(--accent,var(--blue))}.shot h2{font-size:clamp(2.2rem,7vw,6.5rem);line-height:.91;margin:.65rem 0;text-shadow:0 5px 22px #000}.shot p{font-size:clamp(.72rem,1.5vw,1rem);color:#d0d7e0;line-height:1.55;max-width:43ch}.right p{margin-left:auto}.slash{display:block;width:min(230px,48vw);height:2px;margin-top:1rem;background:linear-gradient(90deg,var(--accent,var(--blue)),transparent);box-shadow:0 0 12px var(--accent,var(--blue))}.right .slash{margin-left:auto;transform:scaleX(-1)}
.comic-edge{position:absolute;z-index:3;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 66%,rgba(255,255,255,.08) 66.2% 66.5%,transparent 66.7%)}.progress{position:absolute;z-index:105;left:0;bottom:0;width:100%;height:3px;background:rgba(255,255,255,.09)}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--blue),var(--gold),var(--ember));box-shadow:0 0 12px var(--blue)}.counter{position:absolute;z-index:90;right:max(1.2rem,4vw);bottom:max(4rem,8vh);font:clamp(2rem,5vw,4.8rem) 'Bebas Neue',sans-serif;color:rgba(255,255,255,.13);letter-spacing:.08em}.counter small{display:block;font:500 .52rem 'JetBrains Mono',monospace;letter-spacing:.28em;color:rgba(255,255,255,.45);text-align:right}
.finale{position:absolute;inset:0;z-index:20;opacity:0;visibility:hidden;transition:opacity 1.2s ease;background:#020307}.finale.active{opacity:1;visibility:visible}.finale>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.58) saturate(.9);transform:scale(1.09);transition:transform 14s ease-out}.finale.active>img{transform:scale(1)}.finale::before{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 50% 40%,transparent 0 18%,rgba(1,2,7,.62) 72%),linear-gradient(0deg,#020307 0,transparent 52%)}.final-title{position:absolute;z-index:4;inset:0;display:grid;place-content:center;text-align:center;padding:1rem;opacity:0;transform:scale(1.1);transition:1.3s .5s}.finale.active .final-title{opacity:1;transform:none}.final-title .pre{font:500 clamp(.5rem,1.2vw,.72rem) 'JetBrains Mono',monospace;letter-spacing:.42em;color:#9fd3ff;text-transform:uppercase}.final-title h1{margin:.7rem 0;font-size:clamp(2.5rem,8.5vw,8rem);line-height:.88;letter-spacing:.055em;background:linear-gradient(#fff 10%,#d6e8fb 48%,#648bb2);color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 22px rgba(81,164,239,.3))}.final-title h1 span{display:block;margin-top:1rem;font:500 clamp(.55rem,1.3vw,.9rem) 'JetBrains Mono',monospace;letter-spacing:.33em;color:var(--gold);text-transform:uppercase}.cast{display:flex;justify-content:center;gap:clamp(.25rem,1vw,.7rem);margin:1rem auto}.cast img{width:clamp(42px,6.5vw,82px);height:clamp(42px,6.5vw,82px);object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.72);box-shadow:0 0 20px rgba(73,168,255,.25)}.enter{justify-self:center;margin-top:.45rem;padding:.9rem 1.25rem;color:#fff;text-decoration:none;border:1px solid rgba(102,182,255,.65);background:rgba(2,7,15,.72);font:500 .61rem 'JetBrains Mono',monospace;letter-spacing:.15em;text-transform:uppercase;backdrop-filter:blur(8px)}
@keyframes turn{to{transform:rotate(360deg)}}@keyframes rift{0%,100%{transform:scaleY(0);opacity:0}50%{transform:scaleY(.42);opacity:1}}@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 90px rgba(73,168,255,.3),inset 0 0 45px rgba(154,85,255,.23)}}@keyframes captionIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:700px){.shot::before,.shot.right::before{background:linear-gradient(0deg,rgba(1,2,7,.9),transparent 68%)}.shot .portrait{inset:3.7rem .6rem 8.6rem;width:calc(100% - 1.2rem);height:calc(100% - 12.3rem);object-position:var(--mobile-position,var(--position,center))}.shot-center,.right .shot-center{left:1.1rem;right:1.1rem;bottom:clamp(4.6rem,8vh,5.6rem);text-align:left;max-width:none}.right p{margin-left:0}.right .slash{margin-left:0;transform:none}.shot h2{font-size:clamp(2.15rem,13vw,4.4rem)}.shot p{max-width:31ch}.counter{bottom:3.7rem}.cast img{width:42px;height:42px}.final-title h1{font-size:clamp(2.25rem,13vw,4.8rem)}.final-title h1 span{letter-spacing:.16em}.gate h1{font-size:clamp(2.25rem,12vw,4rem)}}@media(max-width:430px){.sound span{display:none}.sound{width:42px}.skip{font-size:.49rem}.shot p{font-size:.7rem}.cast{gap:.18rem}.cast img{width:36px;height:36px}.final-title .pre{letter-spacing:.22em}.enter{font-size:.54rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.shot img,.finale>img{transform:none!important}}
</style></head>
<body><main class="opening" id="opening">
<section class="gate" id="gate" aria-label="Portal de entrada"><div class="gate-content"><div class="sigil" aria-hidden="true"><span>界</span></div><span class="overline">Arquivo dos Destinos</span><h1>A realidade termina aqui.</h1><p>Além deste limiar, heróis, deuses e mundos impossíveis escrevem juntos uma única história.</p><button class="begin" id="begin" type="button">Romper o Véu do Destino</button></div></section>
<audio id="theme" preload="metadata"><source src="music/themeinicial.mp3" type="audio/mpeg"></audio><div class="topbar"><button class="sound" id="sound" type="button" aria-label="Pausar abertura"><i></i><span>Pausar</span></button><a class="skip destination" href="index.html">Pular abertura →</a></div>
<section class="stage" aria-live="polite"><div class="shots" id="shots"></div><div class="comic-edge" aria-hidden="true"></div><span class="counter" id="counter">01<small>ARQUIVO</small></span></section>
<section class="finale" id="finale"><img src="img-intro/panteao-dos-destinos.png" alt="Todos os heróis reunidos"><div class="final-title"><span class="pre">Quando todas as realidades convergem</span><h1>Guardiões do Destino<span>Heróis · Deuses · Realidades</span></h1><div class="cast"><img src="img-connor/connor.png" alt="Jack Connor"><img src="img-connor/feiticeiro-supremo.png" alt="Dr. Connor"><img src="img-noada/noada.png" alt="Noada"><img src="img-noada/eira-arqueira.png" alt="Eira"><img src="img-alucard/kurosaki-alucard.png" alt="Alucard"><img src="img-nero/nero-hinara-guardioes.png" alt="Nero e Hinara"><img src="img-knull/knullsay.png" alt="Knull e Nimsay"></div><a class="enter destination" href="index.html">Entrar no Arquivo →</a></div></section><div class="progress" aria-hidden="true"><i id="bar"></i></div>
</main><script>
const cast=[
{image:'img-connor/connor-supremo.png',chapter:'O primeiro chamado',name:'Jack Connor',line:'Todo destino começa com alguém disposto a atravessar o impossível.',accent:'#69c6ff',position:'center 20%'},
{image:'img-connor/feiticeiro-supremo.png',chapter:'Mago Supremo',name:'Dr. Connor',line:'Guardião das artes místicas e das fronteiras entre realidades.',accent:'#7ea8ff',side:'right',position:'center 22%'},
{image:'img-noada/noada.png',chapter:'O senhor dos elementos',name:'Noada',line:'A natureza não o obedece. Ela o reconhece.',accent:'#62e2ae',position:'center 20%'},
{image:'img-noada/eira-arqueira.png',chapter:'A luz que permaneceu',name:'Eira Elenwë',line:'Ao lado de Noada, sua força também encontrou um lar.',accent:'#d7f2d8',side:'right',position:'center center'},
{image:'img-noada/noada-e-eira-montanhas.png',chapter:'Dois caminhos',name:'Noada & Eira',line:'Vínculos capazes de sobreviver até ao fim de um mundo.',accent:'#8ce5bb',position:'center center'},
{image:'img-alucard/kurosaki-alucard.png',chapter:'Entre sombras',name:'Kurosaki Alucard',line:'O paranormal observa. Ele nunca desvia o olhar.',accent:'#d093ff',side:'right',position:'center 18%'},
{image:'img-nero/nero-shinkungan-final.png',chapter:'O olho além dos mundos',name:'Nero',line:'O Shinkungan desperta somente em seus olhos — o ápice de todos os dōjutsus.',accent:'#ff6a46',position:'center 17%'},
{image:'img-nero/hinara-shikungan-final.png',chapter:'A evolução do Tenseigan',name:'Hinara',line:'O Shikungan floresce em seus olhos e completa o equilíbrio.',accent:'#7edaff',side:'right',position:'center 17%'},
{image:'img-nero/nero-hinara-guardioes.png',chapter:'Um destino compartilhado',name:'Nero & Hinara',line:'Duas linhagens. Dois olhos supremos. Uma promessa.',accent:'#b48cff',position:'center center'},
{image:'img-knull/yurinull.png',chapter:'O deus dos elementos',name:'Knull',line:'Antes chamado Yuri, agora uma força que impõe silêncio aos mundos.',accent:'#ff774a',position:'center 25%'},
{image:'img-knull/nimsay-humana-armadura.png',chapter:'Rainha e guerreira',name:'Nimsay',line:'Poder arcano, presença soberana e humanidade inabalável.',accent:'#9a71ff',side:'right',position:'center center'},
{image:'img-knull/knullsay.png',chapter:'Fogo, água e eternidade',name:'Knull & Nimsay',line:'Armaduras forjadas lado a lado. Nenhuma realidade os separa.',accent:'#65bfff',position:'center 35%',mobile:'center 28%'}];
const opening=document.querySelector('#opening'),gate=document.querySelector('#gate'),begin=document.querySelector('#begin'),theme=document.querySelector('#theme'),sound=document.querySelector('#sound'),shots=document.querySelector('#shots'),counter=document.querySelector('#counter'),bar=document.querySelector('#bar'),finale=document.querySelector('#finale');let active=-1,raf=0,started=false;
shots.innerHTML=cast.map((c,i)=>`<article class="shot ${c.side==='right'?'right':''}" style="--accent:${c.accent};--position:${c.position};--mobile-position:${c.mobile||c.position}"><img class="backdrop" src="${c.image}" alt="" aria-hidden="true"><img class="portrait" src="${c.image}" alt="${c.name}" loading="${i<2?'eager':'lazy'}"><div class="shot-center"><span class="chapter">${c.chapter}</span><h2>${c.name}</h2><p>${c.line}</p><i class="slash"></i></div></article>`).join('');const shotEls=[...document.querySelectorAll('.shot')];theme.volume=.72;
function selectShot(index){if(index===active)return;if(active>=0){const old=shotEls[active];old.classList.remove('active');old.classList.add('leaving');setTimeout(()=>old.classList.remove('leaving'),800)}active=index;if(active>=0&&shotEls[active]){shotEls[active].classList.add('active');counter.firstChild.nodeValue=String(active+1).padStart(2,'0')}}
function timeline(){if(!started)return;const duration=Number.isFinite(theme.duration)&&theme.duration>1?theme.duration:120,p=Math.min(theme.currentTime/duration,1),finaleAt=.84;bar.style.width=`${p*100}%`;if(p>=finaleAt)finale.classList.add('active');else{finale.classList.remove('active');selectShot(Math.min(cast.length-1,Math.floor((p/finaleAt)*cast.length)))}if(!theme.paused)raf=requestAnimationFrame(timeline)}
async function start(){started=true;gate.classList.add('hidden');opening.classList.add('started');selectShot(0);try{await theme.play();sound.classList.add('on');sound.querySelector('span').textContent='Pausar'}catch{sound.querySelector('span').textContent='Sem áudio'}cancelAnimationFrame(raf);timeline()}
begin.addEventListener('click',start);sound.addEventListener('click',()=>{if(!started){start();return}if(theme.paused){theme.play();sound.classList.add('on');sound.querySelector('span').textContent='Pausar';timeline()}else{theme.pause();sound.classList.remove('on');sound.querySelector('span').textContent='Continuar';cancelAnimationFrame(raf)}});theme.addEventListener('ended',()=>{finale.classList.add('active');bar.style.width='100%';sound.classList.remove('on')});document.querySelectorAll('.destination').forEach(link=>link.addEventListener('click',()=>{sessionStorage.setItem('arquivoIntroVista','1');theme.pause()}));
</script></body></html>
